name: OfflineHorizon game release

# One combined OfflineHorizon vX.Y.Z release contains the game, server, and
# our launcher for every target architecture. No separate launcher@ release.
# The sync controller admits upstream
# commits only after upstream checks/verify, checks/launcher and parity-main pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_029:
        description: Rebuild the combined v0.2.9 release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offlinehorizon-game-release-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  recover_v029:
    # One-time recovery: publish the verified files from run 43462391654,
    # not a new build. Release still contains game + launcher under v0.2.9.
    if: github.repository == 'YourPancakes/OfflineHorizon' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source run, successful builds and retained archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/runs/43462391654")
          jq -e --arg sha "590779d9c56df25d2d12cc46ed3d8870c936b871" '
            .head_sha == $sha and .head_branch == "main" and
            .event == "push" and .status == "completed" and .conclusion == "failure"
          ' <<< "$run" > /dev/null
          jobs=$(gh api "repos/$GH_REPO/actions/runs/43462391654/jobs?per_page=100")
          jq -e '
            ([.jobs[] | select(.name == "source" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "tests" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name | startswith("build (")) | select(.conclusion == "success")] | length) == 5 and
            ([.jobs[] | select(.name == "release" and .conclusion == "failure")] | length) == 1
          ' <<< "$jobs" > /dev/null
          artifacts=$(gh api "repos/$GH_REPO/actions/runs/43462391654/artifacts?per_page=100")
          jq -e '
            (.artifacts | length) == 11 and
            all(.artifacts[]; (.expired == false and .size_in_bytes > 0))
          ' <<< "$artifacts" > /dev/null
      - uses: actions/download-artifact@v4
        with:
          run-id: 43462391654
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - name: Check exact SHA-256 of all 15 finished files
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/SHA256SUMS <<'CHECKSUMS'
          fac6b0d837a68482656a6ccc544d4a440fb9c8a2d78f8783e289d81de87de645  horizon-launcher-linux-x86_64.tar.gz
          a05a9054e6e095812bcbb19a2186ef30fac0c1e113ebce5886d74be5e85301c1  horizon-linux-x86_64.tar.gz
          c6b88b3783377be93da7e12ff851960de1a21eee565ebb3cc41f8dec02c8a246  horizon-server-linux-x86_64.tar.gz
          d6f170385fd1932e34aecbf105a30f8bad28ece29c6593511ee2305f44e3f034  horizon-launcher-macos-arm64.zip
          4fa8557d77f1833273bdc3d4eb3840a8aad3be1d8860595c4eb6b4fd23aff5e3  horizon-launcher-macos-x64.zip
          167bc5c381378d367ad40b650b1867a32a93fee066fbfc6e27f5d3fd4eb6ccbc  horizon-launcher-windows-arm64.zip
          5c10b924d2e95920d2f1b9ea39587b331237477847fbfbd30827eef3a6dfd140  horizon-launcher-windows-x64.zip
          9b3845834fc138ff8fae16d746ee26fd4281e642df881b622e09f2b690ef1193  horizon-macos-arm64.zip
          91f8ea4cc2fb41e2727aa903015aa59be8e31850200bea555874a8326597d411  horizon-macos-x64.zip
          5e856d315931e70ef3399e4d645a22416c108910569126b4c798e597d2e691fc  horizon-windows-arm64.zip
          96d2014ef502b8b82204b4f01b015eeed4bfc350db48414f17822f63c17ccc3b  horizon-windows-x64.zip
          5c980210aa5436e7ef7f34aa614f63c84637dcef57c8ec2b3ac8b818c3020a06  horizon-launcher-setup-arm64.exe
          5fcf403477f972fdcac3fcc27fe46ac3da8aae7f68045387d52fbe195bd6a5e8  horizon-launcher-setup.exe
          50f148e11999fdd5d26823c9932819f8f4b4aa9de5de6a078c399e3c83d98757  horizon-launcher-macos-arm64.dmg
          66a9810f5a2ba01cd2eaf5c4f927ebd55d3dba910912642831dc1b7d28bb05b3  horizon-launcher-macos-x64.dmg
          CHECKSUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create and verify the single combined v0.2.9 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.2.9 > /dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it"
            exit 1
          fi
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.2.9")
          jq -e 'length == 0' <<< "$refs" > /dev/null
          files=(dist/horizon-launcher-linux-x86_64.tar.gz dist/horizon-linux-x86_64.tar.gz dist/horizon-server-linux-x86_64.tar.gz dist/horizon-launcher-macos-arm64.zip dist/horizon-launcher-macos-x64.zip dist/horizon-launcher-windows-arm64.zip dist/horizon-launcher-windows-x64.zip dist/horizon-macos-arm64.zip dist/horizon-macos-x64.zip dist/horizon-windows-arm64.zip dist/horizon-windows-x64.zip dist/horizon-launcher-setup-arm64.exe dist/horizon-launcher-setup.exe dist/horizon-launcher-macos-arm64.dmg dist/horizon-launcher-macos-x64.dmg)
          for file in "${files[@]}"; do test -s "$file"; done
          gh release create v0.2.9 "${files[@]}" dist/SHA256SUMS \
            --target "590779d9c56df25d2d12cc46ed3d8870c936b871" --title "OfflineHorizon 0.2.9" \
            --notes "OfflineHorizon game, launcher, tools and dedicated server.\n\nBuild commit: 590779d9c56df25d2d12cc46ed3d8870c936b871" \
            --draft
          assets=$(gh api "repos/$GH_REPO/releases/tags/v0.2.9" --jq '.assets')
          for file in "${files[@]}" dist/SHA256SUMS; do
            read -r digest _ < <(sha256sum "$file")
            jq -e --arg name "${file##*/}" --arg digest "sha256:$digest" '
              any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)
            ' <<< "$assets" > /dev/null
          done
          gh release edit v0.2.9 --draft=false --latest

  source:
    if: github.repository == 'YourPancakes/OfflineHorizon' && github.event.repository.private == false && !contains(github.event.head_commit.message, '[release-recovery]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify fork's upstream base SHA
        run: |
          set -euo pipefail
          test -s .offline-horizon-upstream-sha
          grep -Eq '^[a-f0-9]{40}$' .offline-horizon-upstream-sha
          echo "Upstream source base: $(cat .offline-horizon-upstream-sha)"
      - name: Check release sources do not contain Minecraft data
        run: python3 tools/check_public_tree.py
      - name: Version for this build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_029: ${{ inputs.rebuild_029 }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add')
          existing=$(jq -r --arg head "$GITHUB_SHA" '
            .[] | select(.draft == false and
              (.target_commitish == $head or ((.body // "") | contains("Build commit: " + $head))))
            | .tag_name | select(test("^v0\\.2\\.[0-9]+$"))
          ' <<< "$releases")
          if [[ -n "$existing" && "$REBUILD_029" != 'true' ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Existing game release for this source: $existing"
            exit 0
          fi
          # Increment independently of GitHub workflow run numbers and launcher tags.
          last=$(jq -r '.[].tag_name | select(test("^v0\\.2\\.[0-9]+$")) | sub("^v0\\.2\\."; "") | tonumber' <<< "$releases" | sort -n | tail -1)
          if [[ "$REBUILD_029" == 'true' || "${last:-0}" -lt 9 ]]; then
            version="0.2.9"
          elif [[ "$last" == '9' ]] && ! jq -e '
            any(.[]; .tag_name == "v0.2.9" and .draft == false and
              ([.assets[] | select(.state == "uploaded" and .size > 0) | .name]
               | index("horizon-launcher-macos-arm64.dmg") != null and index("horizon-launcher-macos-x64.dmg") != null))
          ' <<< "$releases" > /dev/null; then
            version="0.2.9"
          else
            version="0.2.$((last + 1))"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: offline-game-tests
      - name: Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Rust core, friends, and client library tests
        run: cargo test --locked --lib -p horizon-core -p horizon-friends -p horizon-client

  build:
    needs: source
    if: needs.source.outputs.publish == 'true'
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            archive: horizon-linux-x86_64.tar.gz
            folder: horizon-linux-x86_64
            extension: ''
          - os: windows-2025
            name: windows-x64
            pe_arch: x64
            archive: horizon-windows-x64.zip
            folder: horizon-windows-x64
            extension: '.exe'
            rustflags: -C target-feature=+crt-static
          - os: windows-11-vs2026-arm
            name: windows-arm64
            pe_arch: arm64
            archive: horizon-windows-arm64.zip
            folder: horizon-windows-arm64
            extension: '.exe'
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            name: macos-arm64
            archive: horizon-macos-arm64.zip
            folder: horizon-macos-arm64
            extension: ''
          - os: macos-15-intel
            name: macos-x64
            archive: horizon-macos-x64.zip
            folder: horizon-macos-x64
            extension: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HORIZON_VERSION: ${{ needs.source.outputs.version }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      HORIZON_TELEMETRY_URL: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: offline-game-${{ matrix.name }}
          workspaces: |
            .
            launcher
      - name: Set up the Windows ARM64 assembler
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
            $env:PATH = "$llvmBin;$env:PATH"
            $llvmBin >> $env:GITHUB_PATH
          }
          Get-Command clang -ErrorAction Stop
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig1-dev libvulkan-dev
      - name: Build all game and server executables
        run: |
          cargo build --release --locked \
            -p horizon-official --bin horizon-official \
            -p horizon-client-lib --bin horizon-ctl \
            -p horizon-prepare --bin horizon-prepare \
            -p horizon-server --bin horizon-server
      - name: Check Windows game and tool architectures
        if: runner.os == 'Windows'
        run: |
          python tools/check_pe_arch.py "${{ matrix.pe_arch }}" target/release/horizon-official.exe \
            target/release/horizon-ctl.exe target/release/horizon-prepare.exe target/release/horizon-server.exe
      - name: Smoke check compiled binaries
        run: |
          set -euo pipefail
          bin=target/release
          "$bin/horizon-official${{ matrix.extension }}" --help > /dev/null
          "$bin/horizon-ctl${{ matrix.extension }}" --help > /dev/null
          "$bin/horizon-prepare${{ matrix.extension }}" --help > /dev/null
          "$bin/horizon-server${{ matrix.extension }}" --version
      - name: Pack the game, tools, and dedicated server
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.folder }}"
          for executable in horizon-ctl horizon-prepare horizon-server; do
            cp "target/release/$executable${{ matrix.extension }}" "dist/${{ matrix.folder }}/"
          done
          cp "target/release/horizon-official${{ matrix.extension }}" \
             "dist/${{ matrix.folder }}/horizon-client${{ matrix.extension }}"
          # The user's own Minecraft assets are prepared locally. Ship
          # Horizon's open source preparer inputs, never Mojang files.
          git archive HEAD tools mods/horizon/src/test/java crates/horizon-prepare \
            research-lock.json LICENSE packaging/PLAY.txt | \
            tar -xf - -C "dist/${{ matrix.folder }}"
          test -f "dist/${{ matrix.folder }}/research-lock.json"
          cp "dist/${{ matrix.folder }}/packaging/PLAY.txt" "dist/${{ matrix.folder }}/PLAY.txt"
          test -s "dist/${{ matrix.folder }}/PLAY.txt"
          cd dist
          if [[ "${{ matrix.archive }}" == *.tar.gz ]]; then
            tar -czf "${{ matrix.archive }}" "${{ matrix.folder }}"
          elif [[ "$RUNNER_OS" == 'Windows' ]]; then
            7z a -tzip "${{ matrix.archive }}" "${{ matrix.folder }}" > /dev/null
          else
            ditto -c -k --norsrc --noextattr --noqtn --keepParent \
              "${{ matrix.folder }}" "${{ matrix.archive }}"
          fi
          test -s "${{ matrix.archive }}"
      - name: Build launcher for the same game release
        env:
          HORIZON_LAUNCHER_VERSION: ${{ needs.source.outputs.version }}
          HORIZON_LAUNCHER_TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--release --locked --manifest-path launcher/Cargo.toml --bin horizon-launcher)
          if [[ "$RUNNER_OS" == "macOS" ]] && ! xcrun metal --version >/dev/null 2>&1; then
            args+=(--features gpui_platform/runtime_shaders)
          fi
          cargo build "${args[@]}"
          bin="launcher/target/release/horizon-launcher${{ matrix.extension }}"
          [[ "$("$bin" --version | tr -d '\r')" == "horizon-launcher $HORIZON_LAUNCHER_VERSION" ]] ||
            { echo "::error::Launcher and game release versions disagree"; exit 1; }
          mkdir -p dist
          case "${{ matrix.name }}" in
            linux-x64)
              tar -czf dist/horizon-launcher-linux-x86_64.tar.gz -C launcher/target/release horizon-launcher
              ;;
            windows-x64|windows-arm64)
              python tools/check_pe_arch.py "${{ matrix.pe_arch }}" "$bin"
              name="horizon-launcher-windows-x64.zip"
              setup="horizon-launcher-setup.exe"
              if [[ "${{ matrix.name }}" == "windows-arm64" ]]; then
                name="horizon-launcher-windows-arm64.zip"
                setup="horizon-launcher-setup-arm64.exe"
              fi
              (cd launcher/target/release && 7z a -tzip "$GITHUB_WORKSPACE/dist/$name" horizon-launcher.exe)
              cp "$bin" "dist/$setup"
              ;;
            macos-arm64|macos-x64)
              arch=arm64
              [[ "${{ matrix.name }}" == "macos-x64" ]] && arch=x64
              python3 -m venv "$RUNNER_TEMP/dmgbuild"
              "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
              DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
                bash packaging/macos/package.sh "$bin" "$HORIZON_LAUNCHER_VERSION" dist "$arch"
              rm -rf dist/Horizon.app
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: |
            dist/horizon-launcher-*.tar.gz
            dist/horizon-launcher-*.zip
            dist/horizon-launcher-*.dmg
            dist/horizon-launcher-setup*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7
      - name: Build dedicated Linux server engine without audio or controllers
        if: matrix.name == 'linux-x64'
        run: cargo build --release --locked -p horizon-client --no-default-features --bin horizon-client
      - name: Package dedicated Linux server
        if: matrix.name == 'linux-x64'
        run: |
          set -euo pipefail
          dir=dist/horizon-server-linux-x86_64
          mkdir -p "$dir"
          cp target/release/horizon-client "$dir/horizon-engine"
          cp target/release/horizon-server "$dir/horizon-server"
          cp target/release/horizon-prepare "$dir/horizon-prepare"
          git archive HEAD tools mods/horizon/src/test/java crates/horizon-prepare \
            research-lock.json LICENSE packaging/PLAY.txt | tar -xf - -C "$dir"
          cp "$dir/packaging/PLAY.txt" "$dir/PLAY.txt"
          (cd dist && tar -czf horizon-server-linux-x86_64.tar.gz horizon-server-linux-x86_64)
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux-x64'
        with:
          name: horizon-server-linux-x86_64.tar.gz
          path: dist/horizon-server-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [source, tests, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify required archives and write SHA-256 sums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in horizon-linux-x86_64.tar.gz horizon-windows-x64.zip horizon-windows-arm64.zip \
                       horizon-macos-arm64.zip horizon-macos-x64.zip \
                       horizon-server-linux-x86_64.tar.gz \
                       horizon-launcher-linux-x86_64.tar.gz \
                       horizon-launcher-windows-x64.zip horizon-launcher-windows-arm64.zip \
                       horizon-launcher-macos-arm64.zip horizon-launcher-macos-x64.zip \
                       horizon-launcher-setup.exe horizon-launcher-setup-arm64.exe \
                       horizon-launcher-macos-arm64.dmg horizon-launcher-macos-x64.dmg; do
            test -s "$asset" || { echo "::error::Missing $asset"; exit 1; }
          done
          sha256sum horizon-*.tar.gz horizon-*.zip horizon-launcher-setup*.exe horizon-launcher-macos-*.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Publish tested OfflineHorizon game and launcher
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/horizon-*.tar.gz dist/horizon-*.zip dist/horizon-launcher-setup*.exe dist/horizon-launcher-macos-*.dmg)
          notes=$(printf '%s\n\nBuild commit: %s\n' \
            'OfflineHorizon game, launcher, tools and dedicated server.' "$GITHUB_SHA")
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::notice::A newer source commit is on main. Publication belongs to that commit."
            exit 0
          fi
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add')
          if [[ "$TAG" == 'v0.2.9' ]] && jq -e --arg tag "$TAG" 'any(.[]; .tag_name == $tag and .draft == false)' <<< "$releases" > /dev/null; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release upload "$TAG" dist/SHA256SUMS --clobber
            gh release edit "$TAG" --title "OfflineHorizon $VERSION" --notes "$notes"
          else
            if [[ "$TAG" == 'v0.2.9' ]]; then
              refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")
              old=$(jq -r --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")
              if [[ -n "$old" && "$old" != "$GITHUB_SHA" ]]; then
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" -F force=true > /dev/null
              fi
            fi
            gh release create "$TAG" "${assets[@]}" dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "OfflineHorizon $VERSION" --notes "$notes" --latest
          fi
          digests=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets')
          for file in "${assets[@]}" dist/SHA256SUMS; do
            read -r digest _ < <(sha256sum "$file")
            jq -e --arg name "${file##*/}" --arg digest "sha256:$digest" \
              'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)' <<< "$digests" > /dev/null
          done
