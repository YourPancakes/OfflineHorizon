name: OfflineHorizon upstream sync

# Manual fallback only. The VPS watcher checks fully green upstream commits every 120s.
# Never push a synchronised, untested fork snapshot into main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: offlinehorizon-upstream-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'YourPancakes/OfflineHorizon' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_PUBLISH: '1'
      SOURCE_PATH: ${{ github.workspace }}
      UPSTREAM_URL: https://github.com/horizon-rust/horizon.git
      FORK_URL: https://github.com/YourPancakes/OfflineHorizon.git
      BASE_SHA: b880384691b88d317553067109d28e785990bda3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require recorded original source base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .offline-horizon-upstream-sha ]] && grep -Eq '^[a-f0-9]{40}$' .offline-horizon-upstream-sha; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for the approved fork source baseline' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Use isolated temporary work directory
        shell: bash
        run: echo "WORK_ROOT=$RUNNER_TEMP/offlinehorizon-sync" >> "$GITHUB_ENV"
      - name: Validate synchronization scripts
        if: steps.base.outputs.ready == 'true'
        run: python3 -m py_compile tools/offlinehorizon_sync/sync.py tools/offlinehorizon_sync/release_guard.py
      - name: Run sync and release orchestration regression tests
        if: steps.base.outputs.ready == 'true'
        run: python3 -m unittest discover -s tools/offlinehorizon_sync/tests -p 'test_*.py' -q
      - name: Copy only the latest fully green upstream revision
        if: steps.base.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Print the structured error even when the synchronizer exits nonzero.
          # A bare command substitution under set -e suppresses its stdout.
          if result=$(python3 tools/offlinehorizon_sync/sync.py --once); then
            printf '%s\n' "$result"
            printf '%s\n' "$result" > "$RUNNER_TEMP/offlinehorizon-candidate.json"
            printf '### Upstream source synchronization\n\n```json\n%s\n```\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$result"
            printf '### Upstream synchronization failed\n\n```json\n%s\n```\n' "$result" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Dispatch combined fork CI on the candidate, never on main
        if: steps.base.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"])' "$RUNNER_TEMP/offlinehorizon-candidate.json")
          if [[ "$status" == candidate_pushed || "$status" == candidate_exists ]]; then
            branch=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["branch"])' "$RUNNER_TEMP/offlinehorizon-candidate.json")
            [[ "$branch" =~ ^offlinehorizon/candidate/[0-9a-f]{40}-[0-9a-f]{12}$ ]] || exit 1
            gh workflow run offline-game.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          else
            echo "No new candidate to build: $status"
          fi
